[sources]
# The recipe API (`nargs`, deferred argument nodes) is on ExaModels main and in
# no tagged release yet; without this pin CI resolves the registry's v0.11.x
# and every ExaModels-backend test fails on the `nargs` keyword.  This pin
# tracks the #308 branch because robot/glider recipes need `@add_expr`-as-node,
# which is there and not yet on main — REPOINT to main when #308 merges, and
# drop the pin once a release carries the API.
ExaModels = {rev = "abi/multi-model-producer", url = "https://github.com/madsuite-org/ExaModels.jl"}
